version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: schemesense_db
    environment:
      POSTGRES_USER: schemesense
      POSTGRES_PASSWORD: schemesense123
      POSTGRES_DB: schemesense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemesense"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schemesense_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: schemesense_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: schemesense_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://schemesense:schemesense123@db:5432/schemesense
      REDIS_URL: redis://redis:6379
      SECRET_KEY: supersecretkey-change-in-production-atleast32chars!!
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: schemesense_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  qdrantdata:
